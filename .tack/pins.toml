# tack pins. edit by hand or with tack add / rm / alias
# nix reads pins.lock.json; this file drives tack update

[shorturls]
gh = "github:{path}"

[tack]
recomposable = true

[all_follow]
nixpkgs = ["nixpkgs-lib"]
nixpkgs-lib = "nixpkgs"

[inputs.nixpkgs]
# url = "gh:peachey2k2/nixpkgs-weekly"
url = "gh:NixOS/nixpkgs/nixos-unstable?rev=8d5d270900d3fc75655ea2d9d248b234f6631439"
exclude_follow = ["nixpkgs"]

