# Beer tabs: mirror the tab navigation keys from wezterm.
# Beer sends these private escape sequences via text-bindings in beer.toml.
set -s user-keys[0] "\e[27;5;49~"
set -s user-keys[1] "\e[27;5;50~"
set -s user-keys[2] "\e[27;5;51~"
set -s user-keys[3] "\e[27;5;52~"
set -s user-keys[4] "\e[27;5;53~"
set -s user-keys[5] "\e[27;5;54~"
set -s user-keys[6] "\e[27;5;55~"
set -s user-keys[7] "\e[27;5;56~"
set -s user-keys[8] "\e[27;5;57~"
set -s user-keys[9] "\e[27;5;116~"
set -s user-keys[10] "\e[27;5;119~"
set -s user-keys[11] "\e[27;5;9~"
set -s user-keys[12] "\e[27;6;9~"
set -s user-keys[13] "\e[5;5~"
set -s user-keys[14] "\e[6;5~"

# tmux recognizes the xterm-style sequences above as native modified keys.
# Bind those native names; keep User* aliases as fallbacks for older tmux.
bind -n C-1 select-window -t 0
bind -n C-2 select-window -t 1
bind -n C-3 select-window -t 2
bind -n C-4 select-window -t 3
bind -n C-5 select-window -t 4
bind -n C-6 select-window -t 5
bind -n C-7 select-window -t 6
bind -n C-8 select-window -t 7
bind -n C-9 select-window -t 8
bind -n C-t new-window -c '#{pane_current_path}'
bind -n C-w if-shell -F '#{==:#{pane_current_command},nu}' \
  'kill-window' \
  "confirm-before -p 'Close tab? (y/n)' kill-window"
bind -n C-Tab next-window
bind -n C-BTab previous-window
bind -n C-PPage next-window
bind -n C-NPage previous-window

bind -n User0 select-window -t 0
bind -n User1 select-window -t 1
bind -n User2 select-window -t 2
bind -n User3 select-window -t 3
bind -n User4 select-window -t 4
bind -n User5 select-window -t 5
bind -n User6 select-window -t 6
bind -n User7 select-window -t 7
bind -n User8 select-window -t 8
bind -n User9 new-window -c '#{pane_current_path}'
bind -n User10 if-shell -F '#{==:#{pane_current_command},nu}' \
  'kill-window' \
  "confirm-before -p 'Close tab? (y/n)' kill-window"
bind -n User11 next-window
bind -n User12 previous-window
bind -n User13 next-window
bind -n User14 previous-window

# Draw the tmux window list as a top tab bar using the wezterm palette.
set -g status on
set -g status-position top
set -g status-justify left
set -g status-left ''
set -g status-right ''
set -g status-left-length 0
set -g status-right-length 0
set -g status-style 'bg=#071f3f,fg=#c0c0c0'
set -g message-style 'bg=#071f3f,fg=#c0c0c0'
set -g message-command-style 'bg=#071f3f,fg=#c0c0c0'
set -g window-status-separator ''
set -g window-status-format '#[bg=#0b2f57,fg=#c0c0c0] #I: #W '
set -g window-status-current-format '#[bg=#174f8f,fg=#c0c0c0] #I: #W '

# Leave pointer and wheel handling to the outer terminal.
set -g mouse off

bind -n MouseUp1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M'
bind -n MouseDragEnd1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M'
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features ',beer:RGB:extkeys:mouse'
