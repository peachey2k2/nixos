# Match the Catppuccin Mocha theme and transparency used by Ghostty.
[colors]
alpha                = 0.8
background           = "#1e1e2e"
foreground           = "#cdd6f4"
cursor               = "#0077bb"
selection-background = "#585b70"
selection-foreground = "#cdd6f4"
regular = [ "#45475a", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#a6adc8" ]
bright  = [ "#585b70", "#f37799", "#89d88b", "#ebd391", "#74a8fc", "#f2aede", "#6bd7ca", "#bac2de" ]

# Send distinct sequences for tmux's wezterm-like tab shortcuts.
[text-bindings]
"Shift+Enter" = "\\e[13;2u"
"Ctrl+1" = "\\e[27;5;49~"
"Ctrl+2" = "\\e[27;5;50~"
"Ctrl+3" = "\\e[27;5;51~"
"Ctrl+4" = "\\e[27;5;52~"
"Ctrl+5" = "\\e[27;5;53~"
"Ctrl+6" = "\\e[27;5;54~"
"Ctrl+7" = "\\e[27;5;55~"
"Ctrl+8" = "\\e[27;5;56~"
"Ctrl+9" = "\\e[27;5;57~"
"Ctrl+T" = "\\e[27;5;116~"
"Ctrl+W" = "\\e[27;5;119~"
"Ctrl+Tab" = "\\e[27;5;9~"
"Ctrl+Shift+Tab" = "\\e[27;6;9~"
# XKB reports Shift+Tab as ISO_Left_Tab; emit the terminal's standard back-tab.
"Shift+Tab" = "\\e[Z"
"Ctrl+PageUp" = "\\e[5;5~"
"Ctrl+PageDown" = "\\e[6;5~"
